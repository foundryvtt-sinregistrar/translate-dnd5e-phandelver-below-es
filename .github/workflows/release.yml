name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/validate.yml
    with:
      release-tag: ${{ github.ref_name }}

  release:
    name: Publish validated release (Draft)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: module-package
          path: dist

      - name: Verify expected asset exists
        run: |
          test -f "dist/translate-dnd5e-phandelver-below-es.zip"
          test -f "dist/module.json"
          test -f "dist/SHA256SUMS.txt"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          echo "OK: release assets exist"

      - name: Create GitHub Release (DRAFT) and upload asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/module.json
            dist/SHA256SUMS.txt
